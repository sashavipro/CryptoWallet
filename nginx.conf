events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 1. Запросы, касающиеся кошельков, транзакций и блокчейна -> летят в Ethereum Service (8002)
        location /api/v1/wallets { proxy_pass http://ethereum_api:8002; }
        location /api/v1/transactions { proxy_pass http://ethereum_api:8002; }
        location /api/v1/faucet { proxy_pass http://ethereum_api:8002; }
        location /api/v1/assets { proxy_pass http://ethereum_api:8002; }

        # 2. Все остальные запросы (HTML шаблоны, авторизация, профиль) -> летят в REST API (8000)
        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
