[project]
name = "sockets"
version = "0.1.0"
description = "WebSockets Service"
authors = [
    {name = "Author"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.42.0,<0.43.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "python-socketio (>=5.16.1,<6.0.0)",
    "motor (>=3.7.1,<4.0.0)",
    "faststream[rabbit] (>=0.6.7,<0.7.0)",
    "redis (>=7.3.0,<8.0.0)",
    "pyjwt[crypto] (>=2.12.1,<3.0.0)",
    "boto3 (>=1.42.72,<2.0.0)",
    "dishka (>=1.9.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
