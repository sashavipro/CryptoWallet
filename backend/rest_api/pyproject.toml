[project]
name = "rest-api"
version = "0.1.0"
description = "REST API Service"
authors = [
    {name = "Author"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.42.0,<0.43.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "faststream[rabbit] (>=0.6.7,<0.7.0)",
    "taskiq (>=0.12.1,<0.13.0)",
    "taskiq-redis (>=1.2.2,<2.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "cryptography (>=46.0.5,<47.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "taskiq-aio-pika (>=0.6.0,<0.7.0)",
    "dishka (>=1.9.1,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "mailjet-rest (>=1.5.1,<2.0.0)",
    "eth-account (>=0.13.7,<0.14.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
