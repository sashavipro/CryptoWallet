[project]
name = "ethereum"
version = "0.1.0"
description = "Ethereum Blockchain Service"
authors = [
    {name = "Author"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.42.0,<0.43.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "web3 (>=7.14.1,<8.0.0)",
    "faststream[rabbit] (>=0.6.7,<0.7.0)",
    "redis (>=7.3.0,<8.0.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
    "eth-account (>=0.13.7,<0.14.0)",
    "dishka (>=1.9.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "taskiq (>=0.12.1,<0.13.0)",
    "taskiq-aio-pika (>=0.6.0,<0.7.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "aiormq (>=6.9.4,<7.0.0)",
    "aio-pika (>=9.6.2,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
