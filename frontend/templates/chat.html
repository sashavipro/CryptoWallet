{% extends "base.html" %}

{% block title %}Чат - Crypto Wallet{% endblock %}

{% block extra_css %}
<style>
    body, .app-container, .main-wrapper {
        overflow: hidden !important;
    }

    main.content {
        padding: 0 !important;
        overflow: hidden !important;
        display: flex;
        flex-direction: column;
        height: calc(100vh - 60px);
    }

    /* --- Глобальный контейнер чата (сайдбар + основная зона) --- */
    .chat-container {
        display: flex;
        flex-direction: row;
        height: 100%;
        background: #ffffff;
        border-top: 1px solid #ccc;
    }

    /* --- Сайдбар со списком онлайн-пользователей --- */
    .chat-sidebar {
        width: 250px;
        background: #ffffff;
        border-right: 1px solid #ccc;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .online-list {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .online-user {
        display: flex;
        align-items: center;
        padding: 10px 15px;
        border-bottom: 1px solid #e0e0e0;
        cursor: pointer;
        transition: background 0.2s;
    }

    .online-user:hover {
        background: #f0f0f0;
    }

    .online-avatar {
        width: 40px;
        height: 40px;
        border-radius: 4px;
        object-fit: cover;
        margin-right: 15px;
        background-color: #555;
    }

    .online-username {
        font-size: 15px;
        color: #000;
    }

    /* --- Основная зона чата --- */
    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #ffffff;
    }

    .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    /* --- Стилизация сообщений --- */
    .message {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
        width: 100%;
        align-items: flex-start; /* Чужие сообщения прижаты влево */
    }

    .message.own {
        align-items: flex-end; /* Свои сообщения прижаты вправо */
    }

    .message-header {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        margin-bottom: 5px;
    }

    .message.own .message-header {
        flex-direction: row-reverse; /* Имя справа, время слева */
    }

    .msg-name {
        font-size: 16px;
        color: #000;
    }

    .msg-time {
        font-size: 10px;
        color: #000;
        font-weight: bold;
    }

    .message-body {
        display: flex;
        gap: 10px;
        max-width: 80%; /* Ограничиваем ширину пузыря, чтобы он не был на весь экран */
    }

    .message.own .message-body {
        flex-direction: row-reverse; /* Аватар справа, текст слева */
    }

    .msg-avatar {
        width: 40px;
        height: 40px;
        border-radius: 4px;
        object-fit: cover;
        background-color: #555;
        cursor: pointer;
        border: 1px solid #ccc;
        flex-shrink: 0;
    }

    .msg-text {
        background: #e6e6e6;
        border: 1px solid #999;
        padding: 10px 15px;
        border-radius: 4px;
        color: #000;
        font-size: 15px;
        word-wrap: break-word;
    }

    .message.own .msg-text {
        background: #81d4fa;
        border-color: #5bc0de;
    }

    .message-image {
        max-width: 100%;
        max-height: 250px;
        object-fit: cover;
        margin-top: 10px;
        display: block;
        border-radius: 4px;
    }

    /* --- Зона ввода --- */
    .chat-input-wrapper {
        display: flex;
        align-items: center;
        padding: 15px;
        border-top: 1px solid #ccc;
        background: #ffffff;
        gap: 15px;
    }

    .chat-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        font-size: 15px;
        border-radius: 2px;
        outline: none;
    }

    .file-name-display {
        font-size: 13px;
        color: #000;
        max-width: 150px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .btn-attach {
        background: none;
        border: none;
        cursor: pointer;
        color: #000;
        display: flex;
        align-items: center;
    }

    .btn-attach svg { width: 24px; height: 24px; fill: currentColor; }

    .btn-send {
        background: #5cb85c;
        color: white;
        border: none;
        padding: 10px 30px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 2px;
    }

    .btn-send:hover {
        background: #4cae4c;
    }

    .hidden-file-input { display: none; }

    /* --- Модальное окно профиля --- */
    .hidden { display: none !important; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 30px; border-radius: 4px; width: 100%; max-width: 350px; position: relative; text-align: center; }
    .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #666; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cccccc; }
</style>
{% endblock %}

{% block content %}
<div class="chat-container">
    <div class="chat-sidebar">
        <ul class="online-list" id="onlineUsersList">
            <!-- Список онлайн-пользователей -->
        </ul>
    </div>

    <div class="chat-main">
        <div class="chat-messages" id="chatMessages">
            <!-- Сообщения -->
        </div>

        <div class="chat-input-wrapper">
            <input type="text" class="chat-input" id="chatInput" placeholder="Enter Message" autocomplete="off">

            <span id="fileNameDisplay" class="file-name-display"></span>
            <button class="btn-attach" id="btnAttach" title="Прикрепить изображение">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
            </button>
            <input type="file" id="chatImageInput" class="hidden-file-input" accept="image/png, image/jpeg, image/jpg, image/webp">

            <button class="btn-send" id="btnSendMsg">Send</button>
        </div>
    </div>
</div>

<!-- Модалка просмотра профиля -->
<div id="modalUserProfile" class="modal-overlay hidden">
    <div class="modal-content">
        <span class="close-modal" onclick="closeUserProfileModal()">&times;</span>

        <img id="profileModalAvatar" src="" style="width: 120px; height: 120px; border-radius: 4px; object-fit: cover; margin-bottom: 10px; border: 1px solid #ccc;">
        <h2 id="profileModalUsername" style="margin: 0 0 5px 0; color: #333;">Username</h2>
        <p id="profileModalEmail" style="margin: 0 0 20px 0; color: #666; font-size: 14px;">email@example.com</p>

        <div style="background: #f8f9fa; padding: 12px 15px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee;">
            <span style="font-size: 14px; color: #555; font-weight: bold;">Сообщений в чате:</span>
            <span id="profileModalMessagesCount" style="font-size: 18px; color: #3498db; font-weight: bold;">0</span>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script src="/static/js/chat.js"></script>
{% endblock %}
