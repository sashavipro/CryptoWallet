events {
    worker_connections 1024;
}

http {
    upstream ethereum_service {
        server ethereum_api:8002;
    }

    upstream rest_api_service {
        server rest_api:8000;
    }

    server {
        listen 80;

        location /api/v1/assets {
            proxy_pass http://ethereum_service;
        }

        location /api/v1/wallets {
            proxy_pass http://ethereum_service;
        }

        location /api/v1/faucet {
            proxy_pass http://ethereum_service;
        }

        location /api/v1/transactions {
            proxy_pass http://ethereum_service;
        }

        location / {
            proxy_pass http://rest_api_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
